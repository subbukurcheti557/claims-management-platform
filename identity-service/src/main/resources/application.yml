server:
  port: 8081
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:identity_user}
    password: ${DB_PASSWORD:identity_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes-long!!}
    ttl: PT60M
app:
  seed-demo-users: ${SEED_DEMO_DATA:true}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
