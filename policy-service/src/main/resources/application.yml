server:
  port: 8082
spring:
  application:
    name: policy-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/policy_db}
    username: ${DB_USER:policy_user}
    password: ${DB_PASSWORD:policy_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: policy-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes-long!!}
app:
  kafka:
    claims-topic: claims.lifecycle.v1
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
