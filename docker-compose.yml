# Full local stack: infrastructure + 6 Spring services + the Angular single-page app.
#   ./scripts/build-all.sh           (builds jars and the frontend)
#   docker compose up -d --build
# Frontend: http://localhost:4200   Gateway: http://localhost:8080   Eureka: http://localhost:8761

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    JAVA_OPTS: "-Xms96m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    EUREKA_URL: http://discovery-server:8761/eureka
    JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes-long!!}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    SEED_DEMO_DATA: "true"

services:
  postgres:
    image: postgres:16-alpine
    container_name: icmp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: icmp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # S3-compatible object storage for claim photos and documents (Amazon S3 in production).
  # SeaweedFS rather than MinIO: MinIO no longer publishes container images.
  object-storage:
    image: chrislusf/seaweedfs:3.97
    container_name: icmp-object-storage
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - object-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30

  discovery-server:
    <<: *java-service
    build: ./backend/platform/discovery-server
    container_name: icmp-discovery
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      EUREKA_HOSTNAME: discovery-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  identity-service:
    <<: *java-service
    build: ./backend/services/identity-service
    container_name: icmp-identity
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: identity_user
      DB_PASSWORD: identity_pass
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  policy-service:
    <<: *java-service
    build: ./backend/services/policy-service
    container_name: icmp-policy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/policy_db
      DB_USER: policy_user
      DB_PASSWORD: policy_pass
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  claims-service:
    <<: *java-service
    build: ./backend/services/claims-service
    container_name: icmp-claims
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/claims_db
      DB_USER: claims_user
      DB_PASSWORD: claims_pass
      S3_ENDPOINT: http://object-storage:8333
      S3_ACCESS_KEY: claims-dev-access-key
      S3_SECRET_KEY: claims-dev-secret-key-change-me
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  notification-service:
    <<: *java-service
    build: ./backend/services/notification-service
    container_name: icmp-notification
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: notification_user
      DB_PASSWORD: notification_pass
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  api-gateway:
    <<: *java-service
    build: ./backend/platform/api-gateway
    container_name: icmp-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *java-env
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build: ./frontend
    container_name: icmp-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway
    profiles: ["frontend"]

  # Optional: browse topics, messages and consumer groups at http://localhost:8089
  #   docker compose --profile tools up -d kafka-ui
  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    container_name: icmp-kafka-ui
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: icmp-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres-data:
  object-storage-data:
