server:
  port: 8083
  tomcat:
    # read (and discard) oversized uploads so the client gets a 413 instead of a reset connection
    max-swallow-size: 20MB
spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims_db}
    username: ${DB_USER:claims_user}
    password: ${DB_PASSWORD:claims_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  data:
    web:
      pageable:
        max-page-size: 100
security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes-long!!}
app:
  kafka:
    claims-topic: claims.lifecycle.v1
    partitions: 3
  outbox:
    poll-interval-ms: 1000
  services:
    policy-url: http://policy-service
    identity-url: http://identity-service
  claims:
    officer-limit-usd: 25000
    high-value-usd: 50000
    medium-value-usd: 15000
    fx-to-usd:
      SGD: 0.74
      HKD: 0.128
      AUD: 0.66
      MYR: 0.21
      THB: 0.028
      IDR: 0.000063
      USD: 1.0
  documents:
    max-file-size: 10MB
    max-per-claim: 20
    photo-required-for-approval: true
    storage:
      endpoint: ${S3_ENDPOINT:http://localhost:8333}
      region: ${S3_REGION:ap-southeast-1}
      bucket: ${S3_BUCKET:claim-documents}
      access-key: ${S3_ACCESS_KEY:claims-dev-access-key}
      secret-key: ${S3_SECRET_KEY:claims-dev-secret-key-change-me}
      path-style-access: ${S3_PATH_STYLE:true}
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    configs:
      default:
        timeout-duration: 4s
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
