# The single-page application on port 4200. HTML and JSON are never cached; hashed JS/CSS can be.
map $sent_http_content_type $no_cache_html {
  default        "";
  ~*text/html    "no-cache";
  ~*json         "no-cache";
}

server {
  listen 4200;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control $no_cache_html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;

  # client-side routes (/claimant/..., /staff/...) fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
