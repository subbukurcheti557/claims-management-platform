# One container, three origins: the shell (4200) and each micro-frontend (4201, 4202) are served and
# cacheable independently, as they would be from separate CDNs in production.
map $sent_http_content_type $no_cache_html {
  default        "";
  ~*text/html    "no-cache";
  ~*json         "no-cache";
}

server {
  listen 4200;
  root /usr/share/nginx/html/shell;
  include /etc/nginx/conf.d/spa.inc;
}

server {
  listen 4201;
  root /usr/share/nginx/html/claimant;
  include /etc/nginx/conf.d/spa.inc;
}

server {
  listen 4202;
  root /usr/share/nginx/html/staff;
  include /etc/nginx/conf.d/spa.inc;
}
